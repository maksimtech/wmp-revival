[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wmprevival"
dynamic = ["version"]
description = "Local metadata server for Windows Media Player Legacy (MusicBrainz, Discogs)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
authors = [
    {name = "Massimo Moretti"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    # The recorder's HTTPS server and the --forward client: the client accepts a
    # custom resolver, so it connects to the service's real IP while keeping SNI and
    # certificate verification on the original name.
    "aiohttp>=3.10",
    "cryptography>=43",
    # Direct DNS resolution for --forward: the hosts file points the name at 127.0.0.1.
    "dnspython>=2.6",
    "jinja2>=3.1",
    "defusedxml>=0.7",
]

[project.scripts]
wmprevival = "wmprevival.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.version]
path = "src/wmprevival/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wmprevival"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as calls in the default values.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: annotations optional on fixtures and helpers.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disable_error_code = ["type-arg", "var-annotated"]
